<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全景图片</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
    html {
      font-family: "Urbanist", sans-serif;
      overflow: hidden;
    }
    #panorama {
        width: 100vw;
        height: 100vh;
    }
    </style>
</head>
<body>

<div id="panorama"></div>

<script>
pannellum.viewer('panorama', {
    "hfov": 100.0,
    "type": "multires",
    "autoLoad": true,
    "autoRotate": -1,
    "compass": false,
    "showZoomCtrl": false,
    "keyboardZoom": false,
    "mouseZoom": true,
    "preview": "https://gh-proxy.org/https:/raw.githubusercontent.com/museatfnos/pnimstg/main/lingshandao/1/b0_0.jpg",
    "multiRes": {
        "basePath": "https://gh-proxy.org/https:/raw.githubusercontent.com/museatfnos/pnimstg/main/lingshandao",
        "path": "/%l/%s%y_%x",
        "fallbackPath": "/fallback/%s",
        "extension": "jpg",
        "tileResolution": 1024,
        "maxLevel": 3,
        "cubeResolution": 2600
    },
    "title": "灵山岛·202306",
    "author": "Jason"
});
</script>

</body>
</html>
